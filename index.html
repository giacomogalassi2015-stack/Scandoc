<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner ICAO Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <h2>Scanner MRTD (Alloggiati)</h2>
    <p class="help-text">Gira il telefono in orizzontale.</p>
    
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="mirino"></div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <button id="start-button" class="btn">1. Accendi Fotocamera</button>
    <div style="display: flex; gap: 10px; width: 90%; max-width: 400px; justify-content: center;">
        <button id="scan-button" class="btn" style="display:none; width: 50%;">2. Scatta</button>
        <button id="download-button" class="btn btn-success" style="display:none; width: 50%;">3. Scarica TXT</button>
    </div>

    <div id="status">In attesa...</div>
    
    <div style="text-align: center; margin-top: 10px;">
        <canvas id="crop-preview"></canvas>
    </div>

    <div id="result"></div>

    <script src="estrai_carta_identita.js"></script>
    <script src="gestione_output.js"></script>
    <script src="lettore_generale.js"></script>
</body>
</html>
