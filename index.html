<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Completo Documenti e Registrazione Ospiti</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f7f6; padding: 20px; margin: 0; }
        h2 { color: #333; margin-bottom: 5px; text-align: center; }
        .instructions { color: #666; font-size: 0.9rem; text-align: center; margin-bottom: 20px; }
        
        #video-container { position: relative; width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.2); background: #000; }
        #video { width: 100%; display: block; object-fit: cover; }
        #mirino { position: absolute; top: 10%; left: 5%; width: 90%; height: 80%; border: 3px solid #00ff00; border-radius: 8px; box-sizing: border-box; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); }
        #mirino::after { content: 'Allinea il documento qui'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; opacity: 0.7; }
        
        canvas { display: none; }
        
        .btn { margin-top: 15px; padding: 15px 25px; font-size: 16px; font-weight: bold; color: white; background-color: #0056b3; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 300px; transition: background 0.3s; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-success { background-color: #28a745; }
        .btn-danger { background-color: #dc3545; }
        
        #status-bar { margin-top: 20px; padding: 10px; background: #fff3cd; color: #856404; border-radius: 5px; font-weight: bold; width: 100%; max-width: 600px; text-align: center; display: none;}
        
        /* Form dei risultati e gestione soggiorno */
        #data-container { margin-top: 20px; width: 100%; max-width: 600px; display: none; }
        .panel { padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .panel h3 { margin-top:0; color:#333; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.1rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }
        
        .export-section { background-color: #e9ecef; border: 1px solid #ced4da; }
    </style>
</head>
<body>

    <h2>Registrazione Ospiti</h2>
    <p class="instructions" id="instruction-text">Fase 1: Preparati a fotografare il <strong>FRONTE</strong> del documento.</p>

    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="mirino"></div>
    </div>
    
    <canvas id="canvas-capture"></canvas>

    <button id="btn-start" class="btn">Attiva Fotocamera</button>
    <button id="btn-capture-front" class="btn" style="display:none;">📸 Scatta FRONTE</button>
    <button id="btn-capture-back" class="btn btn-success" style="display:none;">📸 Scatta RETRO (MRZ)</button>

    <div id="status-bar"></div>

    <div id="data-container">
        <div class="panel">
            <h3>Dati Documento (Verifica e Correggi)</h3>
            <div class="form-row">
                <div class="form-group"><label>Nome</label><input type="text" id="in-nome"></div>
                <div class="form-group"><label>Cognome</label><input type="text" id="in-cognome"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Sesso</label><input type="text" id="in-sesso" placeholder="M/F"></div>
                <div class="form-group"><label>Data di Nascita</label><input type="text" id="in-data-nascita" placeholder="GG/MM/AAAA"></div>
            </div>
            <div class="form-group"><label>Luogo Nascita (Comune e Prov.)</label><input type="text" id="in-luogo-nascita" placeholder="Inserisci manualmente se mancante"></div>
            <div class="form-row">
                <div class="form-group"><label>Tipo Documento</label><input type="text" id="in-tipo-doc"></div>
                <div class="form-group"><label>N. Documento</label><input type="text" id="in-num-doc"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Cittadinanza</label><input type="text" id="in-cittadinanza" value="Italia"></div>
                <div class="form-group"><label>Luogo Rilascio</label><input type="text" id="in-luogo-rilascio" placeholder="Comune o Questura"></div>
            </div>
        </div>

        <div class="panel">
            <h3>Dati Soggiorno</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Tipo Ospite</label>
                    <select id="in-tipo-ospite">
                        <option value="Ospite Singolo">Ospite Singolo</option>
                        <option value="Capo Famiglia">Capo Famiglia</option>
                        <option value="Capo Gruppo">Capo Gruppo</option>
                        <option value="Familiare">Familiare</option>
                        <option value="Membro Gruppo">Membro Gruppo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Permanenza (Giorni)</label>
                    <input type="number" id="in-giorni" value="1" min="1" max="365">
                </div>
            </div>
            <div class="form-group">
                <label>Data Arrivo</label>
                <input type="date" id="in-data-arrivo">
            </div>
        </div>

        <div class="panel export-section">
            <h3>Salvataggio Sicuro (Cifrato)</h3>
            <p style="font-size: 0.85rem; color: #555;">Imposta una password per proteggere il file. Ti servirà per aprirlo in futuro.</p>
            <div class="form-group">
                <label>Password Crittografia</label>
                <input type="password" id="in-password" placeholder="Inserisci una password sicura">
            </div>
            <button id="btn-export" class="btn btn-danger" style="width: 100%; max-width: none;">🔒 Esporta File Cifrato (.txt)</button>
        </div>
    </div>

    <script>
        // Inizializza la data di arrivo a oggi
        document.getElementById('in-data-arrivo').valueAsDate = new Date();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas-capture');
        const btnStart = document.getElementById('btn-start');
        const btnFront = document.getElementById('btn-capture-front');
        const btnBack = document.getElementById('btn-capture-back');
        const statusBar = document.getElementById('status-bar');
        const dataContainer = document.getElementById('data-container');
        const instructionText = document.getElementById('instruction-text');
        
        let imageFront = null;
        let imageBack = null;

        // 1. Gestione Fotocamera e Scatti
        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
                btnStart.style.display = 'none';
                btnFront.style.display = 'block';
                showStatus("Fotocamera pronta. Inquadra il FRONTE.");
            } catch (err) {
                showStatus("Errore fotocamera. Ricarica e consenti l'accesso.");
            }
        });

        btnFront.addEventListener('click', () => {
            imageFront = captureFrame();
            btnFront.style.display = 'none';
            btnBack.style.display = 'block';
            instructionText.innerHTML = "Fase 2: Gira il documento e fotografa il <strong>RETRO</strong> (dove ci sono le freccette <<<).";
            showStatus("Fronte acquisito. Ora inquadra il RETRO.");
        });

        btnBack.addEventListener('click', async () => {
            imageBack = captureFrame();
            btnBack.disabled = true;
            video.pause(); 
            showStatus("Elaborazione intelligenza artificiale in corso... Attendi.");
            await analizzaDocumentoCompleto();
        });

        function captureFrame() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 1.0);
        }

        function showStatus(msg) {
            statusBar.style.display = 'block';
            statusBar.textContent = msg;
        }

        // 2. Motore OCR (Fronte/Retro e Whitelist)
        async function analizzaDocumentoCompleto() {
            try {
                // Analisi MRZ (Retro)
                const { data: { text: textBack } } = await Tesseract.recognize(imageBack, 'eng', {
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<'
                });
                
                const mrzRegex = /[A-Z0-9<]{28,35}/g;
                const mrzLines = textBack.toUpperCase().replace(/\s/g, '').match(mrzRegex);

                if (mrzLines && mrzLines.length >= 2) {
                    popolaDatiMRZ(mrzLines);
                } else {
                    showStatus("MRZ non letto bene. Puoi compilare i dati manualmente qui sotto.");
                }

                // Tentativo Analisi Fronte (Luogo rilascio)
                showStatus("Leggendo i dati dal fronte...");
                const { data: { text: textFront } } = await Tesseract.recognize(imageFront, 'ita');
                const frontLines = textFront.split('\n');
                let probabileComune = "";
                for(let line of frontLines) {
                    if(line.toUpperCase().includes('COMUNE') || line.toUpperCase().includes('SINDACO')) {
                        probabileComune = line.replace(/comune/i, '').replace(/di/i, '').trim();
                        break;
                    }
                }
                if(probabileComune) document.getElementById('in-luogo-rilascio').value = probabileComune;

                // Mostra Modulo
                showStatus("Lettura completata. Verifica ed eventualmente correggi i dati.");
                document.getElementById('video-container').style.display = 'none';
                instructionText.style.display = 'none';
                dataContainer.style.display = 'block';

            } catch (error) {
                showStatus("Errore durante l'elaborazione OCR.");
            }
        }

        function popolaDatiMRZ(lines) {
            let tipoDoc = lines[0].substring(0, 2).replace(/</g, '');
            if(tipoDoc === 'CA' || tipoDoc === 'C' || tipoDoc === 'ID') tipoDoc = "Carta d'Identità";
            
            const numDoc = lines[0].substring(5, 14).replace(/</g, '');
            const dataNascitaRaw = lines[1].substring(0, 6);
            const sesso = lines[1].substring(7, 8);
            const nazionalita = lines[1].substring(15, 18).replace(/</g, '');
            
            let cognome = "", nome = "";
            if(lines.length >= 3) {
                const nomiRaw = lines[2].split('<<');
                cognome = nomiRaw[0] ? nomiRaw[0].replace(/</g, ' ').trim() : "";
                nome = nomiRaw[1] ? nomiRaw[1].replace(/</g, ' ').trim() : "";
            }

            const formattaData = (yymmdd) => {
                if(!/^\d{6}$/.test(yymmdd)) return ""; 
                let year = parseInt(yymmdd.substring(0, 2));
                const month = yymmdd.substring(2, 4);
                const day = yymmdd.substring(4, 6);
                year = year > 24 ? 1900 + year : 2000 + year; 
                return `${day}/${month}/${year}`;
            };

            document.getElementById('in-cognome').value = cognome;
            document.getElementById('in-nome').value = nome;
            document.getElementById('in-sesso').value = sesso;
            document.getElementById('in-data-nascita').value = formattaData(dataNascitaRaw);
            document.getElementById('in-tipo-doc').value = tipoDoc;
            document.getElementById('in-num-doc').value = numDoc;
            document.getElementById('in-cittadinanza').value = nazionalita === 'ITA' ? 'Italiana' : nazionalita;
        }

        // 3. Generazione File Cifrato e Download
        document.getElementById('btn-export').addEventListener('click', () => {
            const password = document.getElementById('in-password').value;
            if (!password) {
                alert("Devi inserire una password per cifrare i dati prima di esportarli!");
                return;
            }

            // Raccogliamo tutti i dati in un oggetto JSON strutturato
            const recordOspite = {
                dataArrivo: document.getElementById('in-data-arrivo').value,
                giorniPermanenza: document.getElementById('in-giorni').value,
                tipoOspite: document.getElementById('in-tipo-ospite').value,
                nome: document.getElementById('in-nome').value,
                cognome: document.getElementById('in-cognome').value,
                sesso: document.getElementById('in-sesso').value,
                dataNascita: document.getElementById('in-data-nascita').value,
                luogoNascita: document.getElementById('in-luogo-nascita').value,
                cittadinanza: document.getElementById('in-cittadinanza').value,
                tipoDocumento: document.getElementById('in-tipo-doc').value,
                numeroDocumento: document.getElementById('in-num-doc').value,
                luogoRilascio: document.getElementById('in-luogo-rilascio').value,
                timestampRegistrazione: new Date().toISOString()
            };

            // Trasformiamo in stringa e crittografiamo con AES
            const jsonString = JSON.stringify(recordOspite, null, 2);
            const cipherText = CryptoJS.AES.encrypt(jsonString, password).toString();

            // Creiamo il file e lo scarichiamo
            const cognomeOspite = recordOspite.cognome || "Sconosciuto";
            const nomeFile = `Ospite_${cognomeOspite}_${recordOspite.dataArrivo}.aes`;
            
            const blob = new Blob([cipherText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeFile;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert("File salvato con successo! Ricorda la password, altrimenti i dati saranno illeggibili.");
        });
    </script>
</body>
</html>
