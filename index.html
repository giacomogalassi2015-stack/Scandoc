<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#28a745">
    <meta name="description" content="Scanner MRTD per la lettura della banda MRZ tramite Google Cloud Vision.">
    <title>Scanner ICAO - Cloud Vision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Scanner MRTD Pro</h2>
    <p class="help-text">Gira il telefono in orizzontale e inquadra la banda in basso.</p>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="mirino"></div>
    </div>

    <!-- Canvas di servizio (invisibile) usato per il crop interno -->
    <canvas id="canvas" style="display:none;"></canvas>

    <button id="start-button" class="btn">1. Accendi Fotocamera</button>
    <button id="scan-button" class="btn btn-success" style="display:none;">2. Scatta e Leggi</button>

    <div id="status">In attesa...</div>

    <div id="preview-container">
        <p>Anteprima Inviata:</p>
        <canvas id="crop-preview"></canvas>
    </div>

    <div id="result"></div>

    <script src="lettore_generale.js"></script>
</body>
</html>
