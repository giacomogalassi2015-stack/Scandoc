<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner e Generatore File Alloggiati Web</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f7f6; padding: 20px; margin: 0; }
        h2 { color: #333; margin-bottom: 5px; text-align: center; }
        .instructions { color: #666; font-size: 0.9rem; text-align: center; margin-bottom: 20px; }
        
        #video-container { position: relative; width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.2); background: #000; }
        #video { width: 100%; display: block; object-fit: cover; }
        #mirino { position: absolute; top: 10%; left: 5%; width: 90%; height: 80%; border: 3px solid #00ff00; border-radius: 8px; box-sizing: border-box; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); }
        #mirino::after { content: 'Allinea il documento qui'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; opacity: 0.7; }
        
        canvas { display: none; }
        
        .btn { margin-top: 15px; padding: 15px 25px; font-size: 16px; font-weight: bold; color: white; background-color: #0056b3; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 300px; transition: background 0.3s; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-success { background-color: #28a745; }
        .btn-police { background-color: #1a237e; } /* Blu Polizia */
        
        #status-bar { margin-top: 20px; padding: 10px; background: #fff3cd; color: #856404; border-radius: 5px; font-weight: bold; width: 100%; max-width: 600px; text-align: center; display: none;}
        
        /* Form dei risultati e gestione soggiorno */
        #data-container { margin-top: 20px; width: 100%; max-width: 600px; display: none; }
        .panel { padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .panel h3 { margin-top:0; color:#333; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.1rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }
        
        .export-section { background-color: #e8eaf6; border: 1px solid #c5cae9; }
    </style>
</head>
<body>

    <h2>Registrazione Alloggiati</h2>
    <p class="instructions" id="instruction-text">Fase 1: Preparati a fotografare il <strong>FRONTE</strong> del documento.</p>

    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="mirino"></div>
    </div>
    
    <canvas id="canvas-capture"></canvas>

    <button id="btn-start" class="btn">Attiva Fotocamera</button>
    <button id="btn-capture-front" class="btn" style="display:none;">📸 Scatta FRONTE</button>
    <button id="btn-capture-back" class="btn btn-success" style="display:none;">📸 Scatta RETRO (MRZ)</button>

    <div id="status-bar"></div>

    <div id="data-container">
        <div class="panel">
            <h3>Dati Documento</h3>
            <div class="form-row">
                <div class="form-group"><label>Nome</label><input type="text" id="in-nome"></div>
                <div class="form-group"><label>Cognome</label><input type="text" id="in-cognome"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Sesso</label><input type="text" id="in-sesso" placeholder="M/F"></div>
                <div class="form-group"><label>Data di Nascita</label><input type="text" id="in-data-nascita" placeholder="GG/MM/AAAA"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Tipo Documento</label><input type="text" id="in-tipo-doc" value="IDENT"></div>
                <div class="form-group"><label>N. Documento</label><input type="text" id="in-num-doc"></div>
            </div>
        </div>

        <div class="panel">
            <h3>Dati Soggiorno</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Tipo Ospite</label>
                    <select id="in-tipo-ospite">
                        <option value="16">16 - Ospite Singolo</option>
                        <option value="17">17 - Capo Famiglia</option>
                        <option value="18">18 - Capo Gruppo</option>
                        <option value="19">19 - Familiare</option>
                        <option value="20">20 - Membro Gruppo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Permanenza (Giorni)</label>
                    <input type="number" id="in-giorni" value="1" min="1" max="30">
                </div>
            </div>
            <div class="form-group">
                <label>Data Arrivo</label>
                <input type="date" id="in-data-arrivo">
            </div>
        </div>

        <div class="panel export-section">
            <h3 style="color: #1a237e;">Esportazione Alloggiati Web</h3>
            <p style="font-size: 0.85rem; color: #555;">Genera il file testuale (.txt) da caricare sul portale della Polizia di Stato.</p>
            <button id="btn-export" class="btn btn-police" style="width: 100%; max-width: none;">📄 Scarica File Alloggiati</button>
        </div>
    </div>

    <script>
        // Imposta Data Odierna
        document.getElementById('in-data-arrivo').valueAsDate = new Date();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas-capture');
        const btnStart = document.getElementById('btn-start');
        const btnFront = document.getElementById('btn-capture-front');
        const btnBack = document.getElementById('btn-capture-back');
        const statusBar = document.getElementById('status-bar');
        const dataContainer = document.getElementById('data-container');
        const instructionText = document.getElementById('instruction-text');
        
        let imageFront = null;
        let imageBack = null;

        // 1. Fotocamera
        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
                video.srcObject = stream;
                btnStart.style.display = 'none';
                btnFront.style.display = 'block';
                showStatus("Fotocamera pronta. Inquadra il FRONTE.");
            } catch (err) { showStatus("Errore fotocamera."); }
        });

        btnFront.addEventListener('click', () => {
            imageFront = captureFrame();
            btnFront.style.display = 'none';
            btnBack.style.display = 'block';
            instructionText.innerHTML = "Fase 2: inquadra il <strong>RETRO</strong> (con le freccette <<<).";
            showStatus("Fronte acquisito. Ora inquadra il RETRO.");
        });

        btnBack.addEventListener('click', async () => {
            imageBack = captureFrame();
            btnBack.disabled = true;
            video.pause(); 
            showStatus("Lettura OCR in corso... Attendi.");
            await analizzaDocumentoCompleto();
        });

        function captureFrame() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 1.0);
        }

        function showStatus(msg) {
            statusBar.style.display = 'block';
            statusBar.textContent = msg;
        }

        // 2. OCR (Semplificato per l'esempio)
        async function analizzaDocumentoCompleto() {
            try {
                const { data: { text: textBack } } = await Tesseract.recognize(imageBack, 'eng', { tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<' });
                const mrzRegex = /[A-Z0-9<]{28,35}/g;
                const mrzLines = textBack.toUpperCase().replace(/\s/g, '').match(mrzRegex);

                if (mrzLines && mrzLines.length >= 2) {
                    const numDoc = mrzLines[0].substring(5, 14).replace(/</g, '');
                    const dataNascitaRaw = mrzLines[1].substring(0, 6);
                    const sesso = mrzLines[1].substring(7, 8) === 'F' ? 'F' : 'M'; // Forza M o F
                    
                    let cognome = "", nome = "";
                    if(mrzLines.length >= 3) {
                        const nomiRaw = mrzLines[2].split('<<');
                        cognome = nomiRaw[0] ? nomiRaw[0].replace(/</g, ' ').trim() : "";
                        nome = nomiRaw[1] ? nomiRaw[1].replace(/</g, ' ').trim() : "";
                    }

                    const formattaData = (yymmdd) => {
                        if(!/^\d{6}$/.test(yymmdd)) return ""; 
                        let year = parseInt(yymmdd.substring(0, 2));
                        const month = yymmdd.substring(2, 4);
                        const day = yymmdd.substring(4, 6);
                        year = year > 24 ? 1900 + year : 2000 + year; 
                        return `${day}/${month}/${year}`;
                    };

                    document.getElementById('in-cognome').value = cognome;
                    document.getElementById('in-nome').value = nome;
                    document.getElementById('in-sesso').value = sesso;
                    document.getElementById('in-data-nascita').value = formattaData(dataNascitaRaw);
                    document.getElementById('in-num-doc').value = numDoc;
                } else {
                    showStatus("MRZ non letto. Inserisci i dati manualmente.");
                }

                showStatus("Lettura completata.");
                document.getElementById('video-container').style.display = 'none';
                instructionText.style.display = 'none';
                dataContainer.style.display = 'block';

            } catch (error) { showStatus("Errore OCR."); }
        }

        // --- 3. GENERAZIONE TRACCIATO ALLOGGIATI WEB ---
        
        // Funzione per riempire la stringa con spazi bianchi ("pad") come richiesto dalla Polizia
        function padString(str, length) {
            return (str || '').toString().toUpperCase().padEnd(length, ' ').substring(0, length);
        }

        // Funzione per formattare la data da YYYY-MM-DD (del form HTML) a DD/MM/YYYY
        function formattaDataArrivo(dataIso) {
            if(!dataIso) return padString("", 10);
            const parti = dataIso.split('-');
            return `${parti[2]}/${parti[1]}/${parti[0]}`;
        }

        document.getElementById('btn-export').addEventListener('click', () => {
            // Raccogliamo i dati dal modulo
            const tipoOspite = document.getElementById('in-tipo-ospite').value; // Es: "16" (2 caratteri)
            const dataArrivo = formattaDataArrivo(document.getElementById('in-data-arrivo').value); // Es: "19/02/2026" (10 caratteri)
            const giorni = document.getElementById('in-giorni').value.padStart(2, '0').substring(0,2); // Es: "01" (2 caratteri)
            const cognome = padString(document.getElementById('in-cognome').value, 50); // 50 caratteri
            const nome = padString(document.getElementById('in-nome').value, 30); // 30 caratteri
            const sesso = document.getElementById('in-sesso').value.toUpperCase() === 'F' ? '2' : '1'; // 1 carattere (1 = M, 2 = F)
            const dataNascita = padString(document.getElementById('in-data-nascita').value, 10); // 10 caratteri
            
            // DATI FITTIZI IN ATTESA DELLE TABELLE ISTAT (basati sul tuo esempio)
            const comuneNascita = padString("412058091", 9); 
            const provNascita = padString("RM", 2);
            const statoNascita = padString("100000100", 9); 
            const cittadinanza = padString("100000100", 9); 
            
            const tipoDoc = padString(document.getElementById('in-tipo-doc').value, 5); // 5 caratteri (es. IDENT)
            const numDoc = padString(document.getElementById('in-num-doc').value, 20); // 20 caratteri
            const luogoRilascio = padString("412058091", 9); // Dati fittizi

            // Componiamo la stringa finale esatta (168 caratteri)
            const rigaTracciato = tipoOspite + dataArrivo + giorni + cognome + nome + sesso + dataNascita + comuneNascita + provNascita + statoNascita + cittadinanza + tipoDoc + numDoc + luogoRilascio;

            // Piccolo check di sicurezza: deve essere 168
            if (rigaTracciato.length !== 168) {
                console.error("Errore: la riga è lunga " + rigaTracciato.length + " invece di 168 caratteri.");
            }

            // Generazione del File
            const blob = new Blob([rigaTracciato + "\r\n"], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // Nominativo file standard per comodità
            a.download = `alloggiati_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
