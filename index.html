<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner MRZ Avanzato</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; padding: 10px; margin: 0;}
        h2 { margin-top: 5px; font-size: 1.2rem; }
        #video-container { position: relative; width: 100%; max-width: 640px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background: #000; }
        #video { width: 100%; display: block; object-fit: cover; }
        
        /* Il mirino verde per il fallback manuale */
        #mirino { position: absolute; top: 50%; left: 10%; width: 80%; height: 25%; border: 3px dashed #00ff00; box-sizing: border-box; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); }
        
        /* Canvas nascosto per l'elaborazione intera */
        #canvas { display: none; }
        
        /* Canvas visibile per mostrare all'utente cosa legge l'OCR */
        #crop-preview { border: 2px solid blue; margin-top: 10px; max-width: 100%; background: #fff; }
        
        .btn { margin-top: 15px; padding: 15px 25px; font-size: 16px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 8px; cursor: pointer; width: 90%; max-width: 400px;}
        .btn:disabled { background-color: #ccc; }
        #status { margin-top: 15px; font-weight: bold; color: #333; text-align: center; padding: 0 10px; }
        #result { margin-top: 20px; padding: 15px; background: white; border: 1px solid #ddd; width: 90%; max-width: 600px; white-space: pre-wrap; display: none; border-radius: 8px; }
        .help-text { font-size: 0.9rem; color: #555; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Scanner Documenti ITA</h2>
    <p class="help-text"><strong>Consiglio:</strong> Gira il telefono in orizzontale per una lettura migliore.</p>
    
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="mirino"></div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <button id="start-button" class="btn">1. Accendi Fotocamera</button>
    <button id="scan-button" class="btn" style="display:none;">2. Scatta e Analizza</button>

    <div id="status">In attesa...</div>
    
    <div style="text-align: center; margin-top: 10px;">
        <p style="margin:0; font-size:12px; color:gray;" id="preview-label" style="display:none;">Immagine ritagliata per la lettura:</p>
        <canvas id="crop-preview"></canvas>
    </div>

    <div id="result"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const cropCanvas = document.getElementById('crop-preview');
        const startBtn = document.getElementById('start-button');
        const scanBtn = document.getElementById('scan-button');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const mirino = document.getElementById('mirino');

        // Impostazioni fotocamera (forziamo alta risoluzione se possibile)
        const constraints = {
            video: { 
                facingMode: 'environment',
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                startBtn.style.display = 'none';
                scanBtn.style.display = 'block';
                statusDiv.textContent = "Allinea il codice a barre e le scritte nel riquadro verde.";
            } catch (err) {
                statusDiv.textContent = "Errore fotocamera. Ricarica la pagina e consenti l'accesso.";
            }
        });

        scanBtn.addEventListener('click', async () => {
            scanBtn.disabled = true;
            statusDiv.textContent = "Analisi in corso... attendi.";
            resultDiv.style.display = "none";

            // 1. Disegna tutto il frame video sul canvas nascosto
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let cropX, cropY, cropW, cropH;
            let usaMirinoManuale = true;

            // 2. TENTATIVO DI LETTURA CODICE A BARRE (Solo browser supportati come Chrome/Android)
            if ('BarcodeDetector' in window) {
                try {
                    const barcodeDetector = new BarcodeDetector();
                    const barcodes = await barcodeDetector.detect(canvas);
                    
                    if (barcodes.length > 0) {
                        // Ha trovato il codice a barre! Calcoliamo l'area della banda MRZ (che sta sotto)
                        const bc = barcodes[0].boundingBox;
                        cropX = Math.max(0, bc.x - 20); // Un po' di margine a sinistra
                        cropY = bc.y + bc.height;       // Partiamo ESATTAMENTE da sotto il codice a barre
                        cropW = bc.width + 100;         // La banda MRZ è un po' più larga del barcode
                        cropH = bc.height * 2.5;        // L'altezza della banda è circa 2.5 volte il barcode
                        usaMirinoManuale = false;
                        console.log("Barcode trovato come ancora!");
                    }
                } catch (e) {
                    console.log("BarcodeDetector fallito, uso il mirino manuale.");
                }
            }

            // 3. FALLBACK: Se non trova il barcode (o su iPhone), ritaglia ESATTAMENTE dove sta il mirino verde
            if (usaMirinoManuale) {
                // Calcoliamo le coordinate del mirino rispetto al video reale
                const videoRatio = video.videoWidth / video.clientWidth;
                const mirinoRect = mirino.getBoundingClientRect();
                const videoRect = video.getBoundingClientRect();

                cropX = (mirinoRect.left - videoRect.left) * videoRatio;
                cropY = (mirinoRect.top - videoRect.top) * videoRatio;
                cropW = mirinoRect.width * videoRatio;
                cropH = mirinoRect.height * videoRatio;
            }

            // 4. RITAGLIA L'IMMAGINE e mostrala all'utente
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            const cropCtx = cropCanvas.getContext('2d');
            
            // Applichiamo un filtro di contrasto (migliora la lettura OCR)
            cropCtx.filter = 'contrast(1.5) grayscale(1)';
            cropCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            // Converti in immagine da mandare a Tesseract
            const imageData = cropCanvas.toDataURL('image/jpeg', 1.0);

            // 5. LETTURA OCR (Solo sul pezzettino ritagliato)
            try {
                const { data: { text } } = await Tesseract.recognize(imageData, 'eng');
                console.log("Testo grezzo dal ritaglio:\n", text);

                // Pulizia e Regex per trovare le 3 righe da ~30 caratteri
                const cleanText = text.toUpperCase().replace(/\s/g, '');
                const mrzRegex = /[A-Z0-9<]{28,35}/g;
                const mrzLines = cleanText.match(mrzRegex);

                if (mrzLines && mrzLines.length >= 3) {
                    statusDiv.textContent = "Documento letto con successo!";
                    analizzaMRZ(mrzLines.slice(0, 3)); 
                } else {
                    statusDiv.textContent = "Lettura fallita. Controlla l'immagine blu qui sotto: il testo era nitido?";
                    scanBtn.disabled = false;
                }

            } catch (err) {
                statusDiv.textContent = "Errore durante il riconoscimento OCR.";
                scanBtn.disabled = false;
            }
        });

        // Funzione per mostrare i dati (Uguale a prima)
        function analizzaMRZ(lines) {
            try {
                const tipoDoc = lines[0].substring(0, 2).replace(/</g, '');
                const paese = lines[0].substring(2, 5).replace(/</g, '');
                const numDoc = lines[0].substring(5, 14).replace(/</g, '');

                const dataNascitaRaw = lines[1].substring(0, 6);
                const sesso = lines[1].substring(7, 8);
                const scadenzaRaw = lines[1].substring(8, 14);
                const nazionalita = lines[1].substring(15, 18).replace(/</g, '');

                const nomiRaw = lines[2].split('<<');
                const cognome = nomiRaw[0] ? nomiRaw[0].replace(/</g, ' ').trim() : "Non letto";
                const nome = nomiRaw[1] ? nomiRaw[1].replace(/</g, ' ').trim() : "Non letto";

                const formattaData = (yymmdd) => {
                    if(!/^\d{6}$/.test(yymmdd)) return yymmdd; 
                    let year = parseInt(yymmdd.substring(0, 2));
                    const month = yymmdd.substring(2, 4);
                    const day = yymmdd.substring(4, 6);
                    year = year > 50 ? 1900 + year : 2000 + year; 
                    return `${day}/${month}/${year}`;
                };

                resultDiv.innerHTML = `
                    <h3>Dati Estratti:</h3>
                    <strong>Cognome:</strong> ${cognome}<br>
                    <strong>Nome:</strong> ${nome}<br>
                    <strong>Data Nascita:</strong> ${formattaData(dataNascitaRaw)}<br>
                    <strong>Sesso:</strong> ${sesso}<br>
                    <strong>N. Doc:</strong> ${numDoc}
                `;
                resultDiv.style.display = "block";
            } catch(e) {
                statusDiv.textContent = "Formato MRZ non valido.";
            }
            scanBtn.disabled = false;
        }
    </script>
</body>
</html>
