<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettore MRZ Reale</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; padding: 20px; }
        #video-container { position: relative; width: 100%; max-width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #video { width: 100%; display: block; }
        /* Mirino per aiutare l'utente */
        #mirino { position: absolute; top: 60%; left: 10%; width: 80%; height: 30%; border: 3px solid red; box-sizing: border-box; pointer-events: none; }
        #canvas { display: none; }
        .btn { margin-top: 15px; padding: 12px 24px; font-size: 16px; color: white; background-color: #007bff; border: none; border-radius: 5px; cursor: pointer; }
        .btn:disabled { background-color: #ccc; }
        #status { margin-top: 15px; font-weight: bold; color: #333; }
        #result { margin-top: 20px; padding: 15px; background: white; border: 1px solid #ddd; width: 100%; max-width: 600px; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

    <h1>Lettore Documenti ITA</h1>
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div id="mirino"></div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div>
        <button id="start-button" class="btn">1. Accendi Fotocamera</button>
        <button id="scan-button" class="btn" disabled>2. Scatta e Analizza</button>
    </div>

    <div id="status">In attesa...</div>
    <div id="result"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('start-button');
        const scanBtn = document.getElementById('scan-button');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        // 1. Avvio Fotocamera
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                startBtn.style.display = 'none'; // Nascondi il pulsante di avvio
                scanBtn.disabled = false;        // Attiva il pulsante di scatto
                statusDiv.textContent = "Inquadra le 3 righe con le freccette (<<<) nel riquadro rosso e premi Scatta.";
            } catch (err) {
                statusDiv.textContent = "Errore fotocamera: Verifica i permessi.";
            }
        });

        // 2. Scatto e Lettura OCR
        scanBtn.addEventListener('click', async () => {
            scanBtn.disabled = true;
            statusDiv.textContent = "Lettura in corso... tieni fermo il documento.";
            resultDiv.style.display = "none";

            // Imposta canvas come il video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');

            try {
                // Avvia Tesseract per leggere l'immagine
                const { data: { text } } = await Tesseract.recognize(imageData, 'eng');
                
                // Cerca le righe MRZ (stringhe lunghe 30 caratteri con lettere, numeri o '<')
                // Le CIE italiane hanno 3 righe da 30 caratteri
                const mrzRegex = /[A-Z0-9<]{30}/g;
                const mrzLines = text.match(mrzRegex);

                if (mrzLines && mrzLines.length >= 3) {
                    statusDiv.textContent = "Documento letto con successo!";
                    analizzaMRZ(mrzLines.slice(0, 3)); // Prendi le prime 3 righe valide
                } else {
                    statusDiv.textContent = "Non riesco a leggere bene il codice. Riprova, assicurati che sia a fuoco.";
                    scanBtn.disabled = false;
                }

            } catch (err) {
                statusDiv.textContent = "Errore durante il riconoscimento del testo.";
                scanBtn.disabled = false;
            }
        });

        // 3. Estrazione dei dati dalle 3 righe trovate
        function analizzaMRZ(lines) {
            try {
                // Linea 1: Tipo, Paese, Numero Documento
                const tipoDoc = lines[0].substring(0, 2).replace(/</g, '');
                const paese = lines[0].substring(2, 5).replace(/</g, '');
                const numDoc = lines[0].substring(5, 14).replace(/</g, '');

                // Linea 2: Data Nascita, Sesso, Scadenza, Nazionalità
                const dataNascitaRaw = lines[1].substring(0, 6);
                const sesso = lines[1].substring(7, 8);
                const scadenzaRaw = lines[1].substring(8, 14);
                const nazionalita = lines[1].substring(15, 18).replace(/</g, '');

                // Linea 3: Cognome e Nome
                const nomiRaw = lines[2].split('<<');
                const cognome = nomiRaw[0] ? nomiRaw[0].replace(/</g, ' ').trim() : "Non letto";
                const nome = nomiRaw[1] ? nomiRaw[1].replace(/</g, ' ').trim() : "Non letto";

                // Funzione per formattare la data (AAMMGG -> GG/MM/AAAA)
                const formattaData = (yymmdd) => {
                    if(!/^\d{6}$/.test(yymmdd)) return yymmdd; // Se non sono numeri, restituisci grezzo
                    let year = parseInt(yymmdd.substring(0, 2));
                    const month = yymmdd.substring(2, 4);
                    const day = yymmdd.substring(4, 6);
                    year = year > 50 ? 1900 + year : 2000 + year; // Logica secolo base
                    return `${day}/${month}/${year}`;
                };

                // Mostra i risultati
                resultDiv.innerHTML = `
                    <h3>Dati Estratti:</h3>
                    <strong>Cognome:</strong> ${cognome}<br>
                    <strong>Nome:</strong> ${nome}<br>
                    <strong>Data di Nascita:</strong> ${formattaData(dataNascitaRaw)}<br>
                    <strong>Sesso:</strong> ${sesso}<br>
                    <strong>Nazionalità:</strong> ${nazionalita}<br>
                    <strong>Tipo:</strong> ${tipoDoc}<br>
                    <strong>N. Documento:</strong> ${numDoc}<br>
                    <strong>Scadenza:</strong> ${formattaData(scadenzaRaw)}
                `;
                resultDiv.style.display = "block";
            } catch(e) {
                statusDiv.textContent = "Ho letto il testo ma il formato non è quello standard di una CIE italiana. Riprova.";
            }
            scanBtn.disabled = false; // Riattiva per un nuovo scatto
        }
    </script>
</body>
</html>
