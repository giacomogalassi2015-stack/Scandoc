<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1c4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Registrazione Alloggiati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════════ HEADER ═══════════════ -->
    <header id="app-header">
        <button id="btn-header-back" class="header-back" aria-label="Indietro">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="header-center">
            <span class="header-title">Registrazione Alloggiati</span>
            <span class="header-sub" id="header-sub">Seleziona tipo documento</span>
        </div>
        <div class="header-badge">ICAO</div>
    </header>

    <!-- ═══════════════ HOME ═══════════════ -->
    <main id="screen-home" class="screen screen-active">
        <p class="screen-intro">Seleziona il tipo di documento da leggere</p>

        <div class="mode-grid">

            <button class="mode-card" id="btn-passport" data-mode="passport">
                <div class="mode-icon-wrap">
                    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
                        <rect x="9" y="4" width="30" height="40" rx="3" stroke="currentColor" stroke-width="2.5"/>
                        <circle cx="24" cy="19" r="7" stroke="currentColor" stroke-width="2"/>
                        <line x1="17" y1="19" x2="31" y2="19" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M24 12 C21 12 19 15 19 19 C19 23 21 26 24 26 C27 26 29 23 29 19 C29 15 27 12 24 12" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <rect x="13" y="31" width="22" height="2" rx="1" fill="currentColor" opacity=".5"/>
                        <rect x="13" y="36" width="15" height="2" rx="1" fill="currentColor" opacity=".3"/>
                    </svg>
                </div>
                <span class="mode-card-title">Passaporto</span>
                <span class="mode-card-sub">MRZ · 2 × 44 caratteri</span>
            </button>

            <button class="mode-card" id="btn-cie" data-mode="cie">
                <div class="mode-icon-wrap">
                    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
                        <rect x="4" y="11" width="40" height="26" rx="3" stroke="currentColor" stroke-width="2.5"/>
                        <circle cx="16" cy="24" r="5" stroke="currentColor" stroke-width="2"/>
                        <rect x="25" y="18" width="13" height="2" rx="1" fill="currentColor" opacity=".7"/>
                        <rect x="25" y="23" width="9" height="2" rx="1" fill="currentColor" opacity=".5"/>
                        <rect x="8" y="31" width="32" height="1.8" rx=".9" fill="currentColor" opacity=".35"/>
                        <rect x="8" y="34.5" width="32" height="1.8" rx=".9" fill="currentColor" opacity=".2"/>
                    </svg>
                </div>
                <span class="mode-card-title">Carta d'Identità</span>
                <span class="mode-card-sub">CIE · 3 × 30 caratteri</span>
            </button>

            <button class="mode-card mode-card--secondary" id="btn-manual" data-mode="manual">
                <div class="mode-icon-wrap">
                    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
                        <rect x="10" y="6" width="28" height="36" rx="3" stroke="currentColor" stroke-width="2.5"/>
                        <line x1="17" y1="17" x2="31" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="17" y1="24" x2="31" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="17" y1="31" x2="25" y2="31" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="mode-card-title">Inserimento Manuale</span>
                <span class="mode-card-sub">Compila il modulo a mano</span>
            </button>

        </div>
    </main>

    <!-- ═══════════════ FOTOCAMERA ═══════════════ -->
    <main id="screen-camera" class="screen">
        <p class="camera-hint" id="camera-hint">Inquadra la banda MRZ nella parte bassa del documento</p>

        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="mirino">
                <div class="mrz-label">MRZ</div>
            </div>
        </div>

        <!-- Canvas di servizio (invisibili) -->
        <canvas id="canvas" style="display:none;"></canvas>

        <div class="camera-controls">
            <button id="start-button" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
                </svg>
                Accendi Fotocamera
            </button>
            <button id="scan-button" class="btn btn-scan" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/><path d="M3 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M21 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/>
                </svg>
                Scatta e Leggi MRZ
            </button>
        </div>

        <div id="status" class="status-box">In attesa...</div>

        <div id="preview-container">
            <p class="preview-label">Ritaglio inviato a Google Vision</p>
            <canvas id="crop-preview"></canvas>
        </div>

        <div id="result"></div>
    </main>

    <!-- ═══════════════ MODULO ═══════════════ -->
    <main id="screen-form" class="screen">

        <div id="scan-source-badge" class="scan-badge" style="display:none;"></div>

        <!-- Anagrafica -->
        <h2 class="form-section-heading">Anagrafica ospite</h2>
        <div class="form-stack">

            <div class="field-row col-2">
                <div class="field-wrap">
                    <label for="f-cognome">Cognome <span class="req">*</span></label>
                    <input type="text" id="f-cognome" autocomplete="family-name">
                </div>
                <div class="field-wrap">
                    <label for="f-nome">Nome <span class="req">*</span></label>
                    <input type="text" id="f-nome" autocomplete="given-name">
                </div>
            </div>

            <div class="field-row col-3-uneven">
                <div class="field-wrap col-narrow">
                    <label for="f-sesso">Sesso <span class="req">*</span></label>
                    <select id="f-sesso">
                        <option value="">—</option>
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="field-wrap col-wide">
                    <label for="f-nascita">Data di Nascita <span class="req">*</span></label>
                    <input type="date" id="f-nascita">
                </div>
                <div class="field-wrap col-medium">
                    <label for="f-cittadinanza">Cittadinanza <span class="req">*</span></label>
                    <input type="text" id="f-cittadinanza" maxlength="3" style="text-transform:uppercase;">
                </div>
            </div>

            <div class="field-row col-1">
                <div class="field-wrap">
                    <label for="f-comune-nascita">
                        Comune di Nascita <span class="req">*</span>
                        <span class="field-hint" id="hint-comune"></span>
                    </label>
                    <input type="text" id="f-comune-nascita">
                </div>
            </div>

        </div>

        <!-- Documento -->
        <h2 class="form-section-heading">Documento</h2>
        <div class="form-stack">

            <div class="field-row col-2">
                <div class="field-wrap">
                    <label for="f-tipo-doc">Tipo Documento <span class="req">*</span></label>
                    <select id="f-tipo-doc">
                        <option value="">—</option>
                        <option value="P">Passaporto</option>
                        <option value="I">Carta d'Identità</option>
                        <option value="V">Visto</option>
                        <option value="A">Altro</option>
                    </select>
                </div>
                <div class="field-wrap">
                    <label for="f-num-doc">Numero Documento <span class="req">*</span></label>
                    <input type="text" id="f-num-doc" class="mono" autocomplete="off">
                </div>
            </div>

            <div class="field-row col-1">
                <div class="field-wrap">
                    <label for="f-luogo-rilascio">
                        Luogo di Rilascio
                        <span class="field-hint" id="hint-rilascio"></span>
                    </label>
                    <input type="text" id="f-luogo-rilascio">
                </div>
            </div>

        </div>

        <!-- Debug MRZ collassabile -->
        <div id="mrz-accordion" style="display:none;">
            <button class="accordion-btn" id="btn-accordion">
                <span>Dettaglio scansione MRZ</span>
                <svg class="accordion-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="mrz-accordion-body"></div>
        </div>

        <!-- Azioni -->
        <div class="form-actions">
            <button class="btn btn-ghost" id="btn-clear-form">Svuota</button>
            <button class="btn btn-confirm" id="btn-save-form">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Salva Registrazione
            </button>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="lettore_generale.js"></script>
</body>
</html>
